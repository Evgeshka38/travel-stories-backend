components:
  schemas:
    MongoObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectId as a 24-character hexadecimal string.
      example: 68498236a100312bea079008
    Category:
      type: object
      required:
      - _id
      - name
      properties:
        _id:
          allOf:
          - $ref: '#/components/schemas/MongoObjectId'
        name:
          type: string
          example: Азія
    User:
      type: object
      required:
      - _id
      - name
      - avatarUrl
      - description
      - articlesAmount
      properties:
        _id:
          allOf:
          - $ref: '#/components/schemas/MongoObjectId'
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Trimmed before validation. May contain letters, spaces, apostrophes and hyphens.
          example: Матвій Мельник
        avatarUrl:
          type: string
          format: uri
          nullable: true
          default: null
          description: Null until the user uploads an avatar.
          example: https://res.cloudinary.com/example/image/upload/avatar.jpg
        description:
          type: string
          maxLength: 150
          default: ''
          description: Trimmed text. Empty string is allowed to clear the profile description.
          example: Шукаю натхнення у кожній поїздці.
        articlesAmount:
          type: integer
          minimum: 0
          default: 0
          example: 3
    Story:
      type: object
      required:
      - _id
      - img
      - title
      - article
      - category
      - ownerId
      - date
      - favoriteCount
      properties:
        _id:
          allOf:
          - $ref: '#/components/schemas/MongoObjectId'
        img:
          type: string
          format: uri
          example: https://res.cloudinary.com/example/image/upload/story.jpg
        title:
          type: string
          minLength: 1
          maxLength: 80
          example: 'Йорданія: шлях у Петру'
        article:
          type: string
          minLength: 1
          maxLength: 2500
          example: Петра — одне з нових чудес світу...
        category:
          allOf:
          - $ref: '#/components/schemas/MongoObjectId'
        ownerId:
          allOf:
          - $ref: '#/components/schemas/MongoObjectId'
        date:
          type: string
          format: date
          description: Publication date in YYYY-MM-DD format. It is not changed by ordinary story editing.
          example: '2026-10-22'
        favoriteCount:
          type: integer
          minimum: 0
          default: 0
          example: 4
    ErrorResponse:
      type: object
      required:
      - status
      - message
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid request data
      description: MVP error contract. Field-error arrays and machine-readable error codes are not part of the current
        API contract.
