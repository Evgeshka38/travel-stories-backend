paths:
  /api/stories/own:
    get:
      tags:
        - Stories
      summary: Get own stories
      description: Returns a paginated list of stories created by the authenticated user.
      operationId: getOwnStories
      security:
        - cookieAuth: []

      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12

      responses:
        "200":
          description: Successfully found own stories
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found own stories
                  data:
                    type: object
                    properties:
                      stories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Story"
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 12
                      totalItems:
                        type: integer
                        example: 7
                      hasNextPage:
                        type: boolean
                        example: false

        "401":
          description: Unauthorized
          