paths:
  /api/stories:
    get:
      tags:
        - Stories
      summary: Get all stories
      operationId: getStories
      description:
        Returns a paginated list of stories with optional category filtering. Stories are sorted by publication
        date descending with `_id` as a stable tie-breaker. A valid but non-existing category ObjectId returns 200
        with an empty stories array.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          description:
            Number of stories per API page. Keep the same perPage while traversing consecutive pages to
            avoid gaps/duplicates.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 9
        - name: category
          in: query
          required: false
          description: Category MongoDB ObjectId. Malformed value returns 400.
          schema:
            $ref: "#/components/schemas/MongoObjectId"
      responses:
        "200":
          description:
            Successfully found stories. A valid page beyond the end returns 200 with an empty stories
            array.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found stories!
                  data:
                    type: object
                    required:
                      - stories
                      - page
                      - perPage
                      - totalItems
                      - hasNextPage
                      - totalPages
                      - hasPreviousPage
                    properties:
                      stories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Story"
                      page:
                        type: integer
                        minimum: 1
                        example: 1
                      perPage:
                        type: integer
                        minimum: 1
                        example: 9
                      totalItems:
                        type: integer
                        minimum: 0
                        example: 24
                      hasNextPage:
                        type: boolean
                        example: true
                      totalPages:
                        type: integer
                        minimum: 0
                        example: 3
                      hasPreviousPage:
                        type: boolean
                        example: false
              examples:
                empty:
                  value:
                    status: 200
                    message: Successfully found stories!
