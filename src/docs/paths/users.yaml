paths:
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user profile by ID
      description: Returns public user information and a paginated list of their stories.
      operationId: getUserProfile

      parameters:
        - name: id
          in: path
          required: true
          description: User MongoDB ObjectId
          schema:
            type: string
            example: 6881563901add19ee16fd012

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Number of stories per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6

      responses:
        "200":
          description: Successfully found user profile and stories
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found traveller profile and stories
                  data:
                    type: object
                    required:
                      - traveller
                      - stories
                      - page
                      - perPage
                      - totalItems
                      - hasNextPage
                    properties:
                      traveller:
                        $ref: "#/components/schemas/User"
                      stories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Story"
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 6
                      totalItems:
                        type: integer
                        example: 3
                      hasNextPage:
                        type: boolean
                        example: false

        "400":
          description: Invalid request parameters

        "404":
          description: User not found

        "500":
          description: Internal server error
