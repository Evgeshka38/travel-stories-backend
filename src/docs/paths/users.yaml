paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getAllUsers
      description:
        Returns a paginated list of users sorted by articlesAmount descending. `_id` is used as a stable
        tie-breaker. This allows the Home page to request `page=1&limit=4` for the agreed top-4 travellers.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number. Values below 1 are invalid.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of users per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description:
            Successfully found users. A page beyond the end returns 200 with an empty users array and
            hasNextPage=false.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found users
                  data:
                    type: object
                    required:
                      - users
                      - page
                      - perPage
                      - totalItems
                      - hasNextPage
                    properties:
                      users:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
                      page:
                        type: integer
                        minimum: 1
                        example: 1
                      perPage:
                        type: integer
                        minimum: 1
                        example: 9
                      totalItems:
                        type: integer
                        minimum: 0
                        example: 24
                      hasNextPage:
                        type: boolean
                        example: true
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 400
                message: Invalid query parameters
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                message: Internal server error

    patch:
      tags:
        - Users
      summary: Update current user profile
      operationId: updateUser
      security:
        - cookieAuth: []
      description:
        Partially updates the authenticated user. Only name, email and description are accepted. Email
        is normalized with trim + lowercase. Email verification is outside the current MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Trimmed; whitespace-only value is invalid.
                  example: Дмитро Романенко
                email:
                  type: string
                  format: email
                  maxLength: 64
                  description: Trimmed and lowercased before validation and uniqueness check.
                  example: dmytro@example.com
                description:
                  type: string
                  maxLength: 150
                  description: Trimmed. Empty string is allowed to clear the profile description.
                  example: Люблю подорожувати та ділитися історіями.
      responses:
        "200":
          description: Successfully updated user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully updated user profile
                  data:
                    $ref: "#/components/schemas/User"

        "400":
          description: Invalid request data or unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 400
                message: Invalid request data

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                message: Unauthorized

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                message: User not found

        "409":
          description: Email is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                message: Email is already in use

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                message: Internal server error

  /api/users/avatar:
    patch:
      tags:
        - Users
      summary: Update user avatar
      operationId: updateUserAvatar
      security:
        - cookieAuth: []
      description:
        "Updates the authenticated user avatar. Allowed MIME types: image/jpeg, image/png, image/webp.
        SVG/GIF, empty, corrupted, or MIME/content-mismatched files are rejected. Maximum size is 512000 bytes (500
        KiB); exactly 512000 bytes is allowed."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG, PNG or WEBP image, maximum 512000 bytes.
      responses:
        "200":
          description: Avatar updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Avatar updated successfully
                  data:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        format: uri
                        example: https://res.cloudinary.com/example/image/upload/avatar.jpg

        "400":
          description: No file, unsupported type, corrupted file or file larger than 512000 bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 400
                message: Invalid avatar file

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                message: Unauthorized

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                message: Internal server error

  /api/users/me:
    get:
      tags:
        - Users
      summary: Get current user
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      description: Returns the authenticated user profile.
      responses:
        "200":
          description: Successfully found current user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found current user profile
                  data:
                    $ref: "#/components/schemas/User"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                message: Unauthorized

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                message: User not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                message: Internal server error

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user profile by ID
      operationId: getUserProfile
      description:
        Returns public user information and their stories. User stories are ordered by publication date
        descending with `_id` as a stable tie-breaker. A valid page beyond the result set returns 200 with an empty
        stories array.
      parameters:
        - name: id
          in: path
          required: true
          description: User MongoDB ObjectId. Malformed value returns 400; valid but missing user returns 404.
          schema:
            $ref: "#/components/schemas/MongoObjectId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of stories per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
      responses:
        "200":
          description: Successfully found user profile and stories
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found traveller profile and stories
                  data:
                    type: object
                    required:
                      - traveller
                      - stories
                      - page
                      - perPage
                      - totalItems
                      - hasNextPage
                    properties:
                      traveller:
                        $ref: "#/components/schemas/User"
                      stories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Story"
                      page:
                        type: integer
                        minimum: 1
                        example: 1
                      perPage:
                        type: integer
                        minimum: 1
                        example: 6
                      totalItems:
                        type: integer
                        minimum: 0
                        example: 3
                      hasNextPage:
                        type: boolean
                        example: false

        "400":
          description: Invalid ObjectId or query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 400
                message: Invalid request parameters

        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                message: User not found

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 500
                message: Internal server error
