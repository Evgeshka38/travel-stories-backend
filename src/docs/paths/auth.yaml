paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      operationId: registerUser
      description: Creates a user, creates a cookie session and sets accessToken, refreshToken and sessionId cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Trimmed before validation. Whitespace-only value is invalid.
                  example: Дмитро Романенко
                email:
                  type: string
                  format: email
                  maxLength: 64
                  description: Normalized with trim + lowercase before lookup and uniqueness validation.
                  example: dmytro@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Case-sensitive. Password is not trimmed. No additional uppercase/digit requirement
                    is imposed.
                  example: password123
      responses:
        '201':
          description: Successfully registered a user
          headers:
            Set-Cookie:
              description: Sets httpOnly accessToken (15 minutes), refreshToken (1 day) and sessionId (1 day) cookies.
                Production cookies use Secure and SameSite=None.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - data
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully registered a user
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Invalid request data
        '409':
          description: A user with this email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                message: Користувач з таким email вже існує
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login user
      operationId: loginUser
      description: Authenticates by normalized email and password, creates a new cookie session and sets session
        cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 64
                  description: Normalized with trim + lowercase before authentication.
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Case-sensitive and not trimmed.
                  example: password123
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: Sets httpOnly accessToken (15 minutes), refreshToken (1 day) and sessionId (1 day) cookies.
                Production cookies use Secure and SameSite=None.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successful login
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Invalid request data
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Невірний email або пароль
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh session
      operationId: refreshSession
      description: Refreshes the cookie session using the refresh session cookies. Refresh session lifetime is 1
        day. A successful refresh rotates/updates the session and authentication cookies.
      responses:
        '200':
          description: Session refreshed successfully
          headers:
            Set-Cookie:
              description: Sets httpOnly accessToken (15 minutes), refreshToken (1 day) and sessionId (1 day) cookies.
                Production cookies use Secure and SameSite=None.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully refreshed a session
                  data:
                    type: object
                    nullable: true
        '401':
          description: Refresh session is missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error
  /api/auth/session:
    get:
      tags:
      - Auth
      summary: Get current session user
      operationId: getSessionUser
      description: Public session-status endpoint. Always returns 200. For a guest `data` is null; for an authenticated
        session `data` contains the current user.
      responses:
        '200':
          description: Current session status
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found current session user
                  data:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/User'
              examples:
                authenticated:
                  value:
                    status: 200
                    message: Successfully found current session user
                    data:
                      _id: 6881563901add19ee16fd012
                      name: Дмитро Романенко
                      avatarUrl: null
                      description: ''
                      articlesAmount: 0
                guest:
                  value:
                    status: 200
                    message: User is not authenticated
                    data: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout user
      operationId: logoutUser
      security:
      - cookieAuth: []
      description: Removes the current session and clears accessToken, refreshToken and sessionId cookies.
      responses:
        '204':
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: Clears accessToken, refreshToken and sessionId cookies.
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal server error
