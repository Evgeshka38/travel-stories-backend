paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register user
      description: Creates a new user account, creates a session and sets session cookies.
      operationId: registerUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 1
                  example: "Дмитро Романенко"
                email:
                  type: string
                  format: email
                  example: "dmytro@example.com"
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: "password123"

      responses:
        "201":
          description: Successfully registered a user
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Successfully registered a user"
                  data:
                    $ref: "#/components/schemas/User"

        "400":
          description: Invalid request data

        "409":
          description: A user with this email is already registered

        "500":
          description: Internal server error

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticates a user by email and password, creates a new session and sets session cookies.
      operationId: loginUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"

      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Successful login"
                  data:
                    $ref: "#/components/schemas/User"

        "400":
          description: Invalid request data

        "401":
          description: Invalid email or password

        "500":
          description: Internal server error

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Logs out the authenticated user, removes the current session and clears authentication cookies.
      operationId: logoutUser

      security:
        - cookieAuth: []

      responses:
        "204":
          description: Successfully logged out

        "401":
          description: Unauthorized

        "500":
          description: Internal server error
